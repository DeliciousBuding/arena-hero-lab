[project]
name = "arena-hero-lab-workspace"
version = "0.1.0"
description = "Workspace tooling for Arena Hero simulation, benchmarks, and research."
requires-python = ">=3.12,<3.13"
dependencies = [
  "arena-hero-sim",
  "arena-hero-bench",
  "arena-hero-research",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "ruff>=0.12.0",
  "ty>=0.0.1a16",
]

[tool.uv]
package = false

[tool.uv.sources]
arena-hero-sim = { workspace = true }
arena-hero-bench = { workspace = true }
arena-hero-research = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/leaderboard-web"]
src = [
  "packages/arena-hero-sim/src",
  "packages/arena-hero-bench/src",
  "packages/arena-hero-research/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["packages"]
