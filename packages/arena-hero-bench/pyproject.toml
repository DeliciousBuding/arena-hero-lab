[project]
name = "arena-hero-bench"
version = "0.1.0"
description = "Benchmark orchestration, artifact contracts, and report conversion for Arena Hero."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["arena-hero-sim"]

[project.scripts]
arena-hero-bench = "arena_hero_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena_hero_bench"]

[tool.uv.sources]
arena-hero-sim = { workspace = true }
